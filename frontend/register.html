<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — ShopSmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand"><i class="fa-solid fa-bag-shopping"></i> Shop<span>Smart</span></a>
    <div class="nav-links"><a href="index.html">Home</a><a href="categories.html">Categories</a><a href="products.html">All Products</a></div>
    <form class="nav-search" id="navSearchForm"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="navSearchInput" placeholder="Search for products, brands and more"></form>
    <div class="nav-actions">
      <a href="wishlist.html" class="nav-icon-link"><i class="fa-solid fa-heart"></i></a>
      <a href="cart.html" class="nav-icon-link"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge">0</span></a>
      <div id="navAuthSlot"></div>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="subtitle">Join ShopSmart to track orders and save your wishlist</p>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Your full name">
      <div class="form-error" id="err-regName">Name is required</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com">
      <div class="form-error" id="err-regEmail">Enter a valid email</div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="At least 6 characters">
      <div class="form-error" id="err-regPassword">Password must be at least 6 characters</div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="regConfirmPassword" placeholder="Re-enter your password">
      <div class="form-error" id="err-regConfirmPassword">Passwords do not match</div>
    </div>
    <button class="btn-submit" id="registerBtn">Create Account</button>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">&copy; 2026 ShopSmart. All rights reserved.</div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
